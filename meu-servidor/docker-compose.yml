services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: 1000:1000 # No Windows com Docker Desktop, remova esta linha
    ports:
      - "8096:8096"
    volumes:
      - ./config/jellyfin:/config
      - ./midia:/midia:ro
      - "E:/musicas:/musicas:ro"
    restart: unless-stopped
